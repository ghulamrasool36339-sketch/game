name: Build Nova Strike Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and Capacitor Android
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build game bundle
        run: npm run build

      - name: Generate Android project and sync
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Nova Strike APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Strike-Game-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
